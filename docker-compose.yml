services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_APP_URL=${VITE_APP_URL}
        - VITE_API_URL=${VITE_API_URL}
    expose:
      - "80"
    restart: always
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wellnessclub.rule=Host(`apps-server-wellness-club.lig4xy.easypanel.host`)"
      - "traefik.http.routers.wellnessclub.entrypoints=websecure"
      - "traefik.http.routers.wellnessclub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wellnessclub.priority=100"
      - "traefik.http.services.wellnessclub.loadbalancer.server.port=80"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.wellnessclub-api.rule=Host(`voucher.htf.solutions`) && PathPrefix(`/api`)"
      - "traefik.http.routers.wellnessclub-api.service=wellnessclub-api"
      - "traefik.http.services.wellnessclub-api.loadbalancer.server.port=3001"
    networks:
      - easypanel
      - default

networks:
  easypanel:
    external: true
